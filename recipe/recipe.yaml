schema_version: 1

context:
  name: flake8-isort
  version: "7.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ee28333c6deb834908cda1899c3da7d59ab0429482bb200fb7b3cc4182d2bcab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - flake8
    - isort >=5.0.0

tests:
  - python:
      imports:
        - flake8_isort
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: flake8 plugin that integrates isort .
  homepage: https://github.com/gforcada/flake8-isort
  repository: https://github.com/gforcada/flake8-isort

extra:
  recipe-maintainers:
    - dopplershift
    - marcelotrevisani
    - xylar
